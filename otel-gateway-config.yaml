receivers:
  # Telemetry from the applications (OTel demo)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Node/system metrics forwarded by the otel-agent DaemonSet
  otlp/agent:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319

processors:
  cumulativetodelta: {}  # the ES exporter drops cumulative histograms
  elasticapm: {}  # enriches spans/logs with attributes for the Applications UI
  # Envoy (frontend-proxy) egress spans carry no destination, only the upstream
  # cluster name. Set peer.service so the service map can draw the edge.
  transform/envoy-peer:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - resource.attributes["service.name"] == "frontend-proxy"
          - kind == SPAN_KIND_CLIENT
          - attributes["upstream_cluster"] != nil
        statements:
          - set(attributes["peer.service"], attributes["upstream_cluster"])
  batch/metrics:
    send_batch_max_size: 0
    timeout: 1s
  k8sattributes:
    passthrough: false
    pod_association:
      - sources: [{from: resource_attribute, name: k8s.pod.ip}]
      - sources: [{from: resource_attribute, name: k8s.pod.uid}]
      - sources:
          - {from: resource_attribute, name: k8s.pod.name}
          - {from: resource_attribute, name: k8s.namespace.name}
      - sources: [{from: connection}]
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.ip
        - k8s.pod.uid
        - k8s.pod.start_time
  resourcedetection/env:
    detectors: [env]
    timeout: 2s
    override: false

exporters:
  debug:
    verbosity: basic
  elasticsearch/otel:
    endpoints: ["${env:ELASTIC_ENDPOINT}"]
    user: ${env:ELASTIC_USER}
    password: ${env:ELASTIC_PASSWORD}
    tls:
      insecure_skip_verify: true # mount the CA instead for production
    mapping:
      mode: otel

connectors:
  elasticapm: {}  # aggregates traces into the APM metrics for Kibana

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics/agent:
      receivers: [otlp/agent]
      processors: [batch/metrics]
      exporters: [elasticsearch/otel]
    metrics/otlp:
      receivers: [otlp]
      processors: [cumulativetodelta, batch/metrics, k8sattributes, resourcedetection/env]
      exporters: [elasticsearch/otel]
    traces:
      receivers: [otlp]
      processors: [batch/metrics, k8sattributes, resourcedetection/env, transform/envoy-peer, elasticapm]
      exporters: [elasticapm, elasticsearch/otel]
    metrics/apm:
      receivers: [elasticapm]
      processors: []
      exporters: [elasticsearch/otel]
    logs:
      receivers: [otlp]
      processors: [batch/metrics, k8sattributes, resourcedetection/env]
      exporters: [elasticsearch/otel]

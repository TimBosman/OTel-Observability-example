default:
  envOverrides:
    - name: OTEL_COLLECTOR_NAME
      value: otel-gateway.otel.svc.cluster.local

opentelemetry-collector:
  enabled: false
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

components:
  flagd:
    # The chart default (75Mi) gets flagd OOMKilled, so calls from ad time out.
    resources:
      limits:
        memory: 200Mi

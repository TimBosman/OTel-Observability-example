apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-cluster
  namespace: otel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-cluster
rules:
  # k8s_cluster receiver
  - apiGroups: [""]
    resources: ["events", "namespaces", "namespaces/status", "nodes", "nodes/spec", "pods", "pods/status", "replicationcontrollers", "replicationcontrollers/status", "resourcequotas", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["daemonsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-cluster
subjects:
  - kind: ServiceAccount
    name: otel-cluster
    namespace: otel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-cluster
  namespace: otel
  labels:
    app: otel-cluster
spec:
  replicas: 1 # k8s_cluster must be a singleton
  selector:
    matchLabels:
      app: otel-cluster
  template:
    metadata:
      labels:
        app: otel-cluster
    spec:
      serviceAccountName: otel-cluster
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:${OTEL_VERSION}
          args: ["--config=/conf/config.yaml"]
          ports:
            - containerPort: 13133
              name: health
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              memory: 400Mi
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-cluster-config

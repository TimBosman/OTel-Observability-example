receivers:
  # Telemetry from the applications (OTel demo)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Node/system metrics forwarded by the otel-agent DaemonSet
  otlp/agent:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319

processors:
  cumulative_to_delta: {} # the ES exporter drops cumulative histograms
  elasticapm: {} # enriches spans/logs with attributes the Applications UI expects
  # Don't split metric requests: can cause version_conflict_engine_exception in TSDB
  batch/metrics:
    send_batch_max_size: 0
    timeout: 1s
  k8s_attributes:
    passthrough: false
    pod_association:
      - sources: [{from: resource_attribute, name: k8s.pod.ip}]
      - sources: [{from: resource_attribute, name: k8s.pod.uid}]
      - sources:
          - {from: resource_attribute, name: k8s.pod.name}
          - {from: resource_attribute, name: k8s.namespace.name}
      - sources: [{from: connection}]
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.ip
        - k8s.pod.uid
        - k8s.pod.start_time
  resourcedetection/env:
    detectors: [env]
    timeout: 2s
    override: false

exporters:
  debug:
    verbosity: basic
  elasticsearch/otel:
    endpoints: ["${env:ELASTIC_ENDPOINT}"]
    user: ${env:ELASTIC_USER}
    password: ${env:ELASTIC_PASSWORD}
    tls:
      insecure_skip_verify: true # ECK self-signed CA; mount the CA instead for production
    mapping:
      mode: otel

connectors:
  elasticapm: {} # aggregates traces into the APM metrics the Applications UI reads

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics/agent:
      receivers: [otlp/agent]
      processors: [batch/metrics]
      exporters: [elasticsearch/otel]
    metrics/otlp:
      receivers: [otlp]
      processors: [cumulative_to_delta, batch/metrics, k8s_attributes, resourcedetection/env]
      exporters: [elasticsearch/otel]
    traces:
      receivers: [otlp]
      processors: [batch/metrics, k8s_attributes, resourcedetection/env, elasticapm]
      exporters: [elasticapm, elasticsearch/otel]
    metrics/apm:
      receivers: [elasticapm]
      processors: []
      exporters: [elasticsearch/otel]
    logs:
      receivers: [otlp]
      processors: [batch/metrics, k8s_attributes, resourcedetection/env]
      exporters: [elasticsearch/otel]
